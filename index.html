<head>

<link rel="manifest" href="manifest.webmanifest">

<div id="gate" hidden>

    <button id="gate-enter" class="btn primary">Entrar</button>
    <button id="gate-new" class="btn">Crear un código nuevo</button>
    <p id="gate-msg" class="muted small"></p>
  </div>
</div>
<div id="app" hidden>
  <header class="top"><span class="brand"><img src="icons/icon-192-v2.png" alt="" class="logo">Desarrollo empresarial</span><span id="sync-state" class="small muted"></span></header>
  <main id="view"></main>
  <nav class="tabs">
